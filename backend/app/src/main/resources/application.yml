spring:
  application:
    name: orchestragent
  config:
    # Loads the gitignored .env file (KEY=value lines) when present. The working directory is either the
    # repository root (java -jar) or backend/app (Gradle bootRun).
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../../.env[.properties]"
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  flyway:
    # Migrations are run per module by ModuleFlywayRunner in the platform module.
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  modulith:
    events:
      republish-outstanding-events-on-restart: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

orchestragent:
  security:
    jwt-secret: ${JWT_SECRET:}
    # Session and CSRF cookies are Secure unless a profile turns this off (dev and test only).
    cookie-secure: true
  mail:
    from: noreply@orchestragent.local
  # Public URL of the web app, used for links in emails.
  app-base-url: ${APP_BASE_URL:http://localhost:5173}
  # Fixed login code. Only the "dev" profile reads it; every other profile ignores it.
  dev-login-code: ${DEV_LOGIN_CODE:}
